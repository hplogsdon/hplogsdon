<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" type="text/css" href="/stylesheets/default.css">
		<meta charset="UTF-8">
		<title>{{ page.title | replace: '&nbsp;', ' ' | escape }}</title>
		{% if page.description %}
		<meta name="description" content="{{ page.description | escape }}">
		{% endif %}
		<meta name="author" lang="en" content="Howard P. Logsdon">
		<meta content="initial-scale=1.0" name="viewport">
		<link rel="icon" href="/favicon.ico">

		{% if page.styles %}
		<style type="text/css" media="screen">{{ page.styles }}</style>
		{% endif %}
	</head>

	<body>
		<div id="wrapper">
			<header id="masthead" class="fix">
				<h1><a href="/">HPLogsdon</a></h1>
			</header>

			<div id="filler" class=fix">

				{{ content }}

			</div>
		</div>
	</body>
</html>
