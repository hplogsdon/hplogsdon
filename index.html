---
layout: default
title: HPLogsdon
---
<section id="main-column">
	{% for post in site.posts %}
		<div class="post-meta">
			<ul>
				<li>{{ post.date | date_to_long_string }}</li>
				<li>Section: <b>{{ post.categories | array_to_sentence_words }}</b></li>
				<li class="perma"><a href="{{ post.url }}">Permalink</a></li>
			</ul>
		</div>
		<div id="post" class="post">
			<h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
			<div class="post-descripton">
				<p>{{ post.description }}</p>
			</div>
		</div>
	{% endfor %}
</section>

<div class="secondary-column">
</div>
